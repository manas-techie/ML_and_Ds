<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>form</title>
    </head>
    <body>
        <h1>Submit Form</h1>
        <form method="POST" action="/getresult">
            <label for="name">Mark: Math</label>
            <input type="number" id="name" name="name" min="0" required>
            <br><br>
            <label for="email">Mark: Science</label>
            <input type="number" id="email" name="email" min="0" required>
            <br><br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
